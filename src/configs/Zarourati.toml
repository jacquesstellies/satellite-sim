debug_log = false

[simulation]
enable = true
duration = 300 # ref series ends at 120; extra dwell lets xi decay to its floor (accuracy)
test_mode_en = false
test_duration = 3
test_resolution = 1
iterations = 1
tuning = false
input_type="ref" # ref, ref_square, torque, sine, square
verbose = true

[controller]
enable = true
c = [ 1, 1, 1,]
k = 2
kj = 2
kd = 4
ki = 50
T_max = 1000
T_min = 0
filter_coef = 0
t_sample = 0.01
type = "backstepping" # pid, backstepping, adaptive
sub_type = "Zarourati" # Nadafi_FNDO, Nadafi_MFNDO, Shen, Zarourati
adaptive_gain = 0.1
detection_en = true

[backstepping]
alpha = 1 # makes peaks and troughs more pointy
beta = 1.8 # similar to kd
k = 100 # similar to kp
eta_1 = 0.1
upsilon = 0.01
c_1 = 0.01
c_2 = 0.1

[Zarourati]
# Control gains (paper Table 2 uses k_w=100, k_d=5 -- tuned for a continuous-time sim.
# At t_sample=0.01 k_w=100 gives the eta loop a ~110 rad/s bandwidth (marginal vs the
# 100 Hz sample rate -> rail-to-rail chatter), so k_w is scaled to ~fs/10. k_d bounds the
# disturbance (now ~1e-4 N.m per paper Eq. 38), so 5 N.m of sign(eta) is pure chatter.
k_a = 1.0
# k_u sets the unactuated-axis convergence rate (tau ~ 2/k_u) but also the excitation
# demand k_u*e_u/xi, which must stay within the wheel slew authority (~0.1 rad/s here).
# Paper's 0.5 needs e_u << xi at all times; 0.3 keeps kappa1 off its clamp during slews.
k_u = 0.3
k_w = 10.0
k_d = 0.02
k_phi = 1.0
# Prescribed-performance xi = gamma0*exp(-gamma1*tau) + gamma2 (tau = time since activation).
# Paper Table 2 uses gamma0=0.5, gamma1=1, gamma2=0.001, which collapses xi to its floor in
# ~3 s and makes kappa1 = (1/xi^2)*(...) blow up before convergence. Slower decay + higher
# floor is stable. NOTE the actuated error e_a is *commanded* to track the spiral e_d with
# ||e_d|| = xi, so gamma0 sets the initial excitation swing (0.1 ~ 11 deg) and gamma2 sets
# the steady-state wobble amplitude / final accuracy (~2*gamma2 rad).
# xi must upper-bound the tracking error at all times (prescribed performance): the
# kappa gains only give usable unactuated feedback while |k_u*e_u + e4*w_eu| < kappa_max*xi^2.
# With xi_reset_on_maneuver, gamma0 must cover the per-slew transient (0.3; smaller values
# let e_u escape mid-slew) and gamma1 sets accuracy at waypoint arrival (xi(30s) ~ 0.077
# -> ~9 deg wobble; faster decay breaks the excitation mechanism mid-slew). Grid-searched.
gamma0 = 0.3
gamma1 = 0.05
gamma2 = 0.01
# Restart the xi envelope at the start of each waypoint slew (see controller.py).
xi_reset_on_maneuver = true
# Boundary layer replacing sign(eta) in the dynamic control law (prevents chatter).
eta_boundary_layer = 0.05
# Low-pass coefficient for the d(we_u)/dt finite difference.
dwe_u_filter_coef = 0.8
# Guard for 1/e4 terms in kappa2 when e4 -> 0.
e4_eps = 0.01
# Clamp on the unbounded 1/xi^2 kinematic gains kappa1/kappa2. Sized so the e_d excitation
# u_k ~ kappa*xi stays within what the wheels can slew (J^-1 * u_max ~ 0.1 rad/s^2).
kappa_max = 2.0
# Control-torque saturation (paper actuator limit u_m = 0.01 N.m).
u_max = 1.0

